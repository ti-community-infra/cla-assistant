name: Release GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: v2026.11.3
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # A dedicated package path avoids the pre-existing
          # ti-community-infra/cla-assistant package, whose ownership is not
          # linked to this repository's GITHUB_TOKEN.
          tags: ghcr.io/ti-community-infra/cla-assistant/patched:${{ github.event.inputs.tag || github.ref_name }}
