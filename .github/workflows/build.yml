name: CI

on:
  pull_request:
    branches:
      - main
      - pingcap-main
  push:
    branches:
      - main
      - pingcap-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Lint and test
        run: npx grunt test
